services:
  postgresql-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: benchmark_postgres
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - elastic
  pgadmin:
    image: dpage/pgadmin4
    ports:
      - 8080:80
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgresql-db
    networks:
      - elastic

  mongo-db:
    image: mongo:4
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodata:/data/db
    networks:
      - elastic

  mongo-express:
    image: mongo-express:0.54
    ports:
      - 8082:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_SERVER: mongo-db
    depends_on:
      - mongo-db
    networks:
      - elastic

  elasticsearch-db:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.12.1
    environment:
      discovery.type: "single-node"
      ELASTIC-PASSWORD: password
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    networks:
      - elastic
  
  graphql-api:
    build: ./graphql_app
    ports:
      - "8000:8000"
    depends_on:
      - postgresql-db
      - mongo-db
    networks:
      - elastic
    environment:
      POSTGRES_URL: postgresql://postgres:password@postgresql-db:5432/benchmark_postgres
      MONGO_URL: mongodb://mongo-db:27017

  app:
    build: ./benchmark_app
    volumes:
      - .:/benchmark
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgresql-db
      - mongo-db
      - elasticsearch-db
    networks:
      - elastic
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock

volumes:
  pgdata:
  mongodata:
  esdata:


networks:
  elastic:
    driver: bridge
